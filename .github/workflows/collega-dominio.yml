# Collega www.localcare.it al progetto Pages. Avvio MANUALE:
# Actions > "Collega dominio www.localcare.it" > Run workflow
# Dopo il collegamento, creare su register.it il record CNAME indicato in output.
name: Collega dominio www.localcare.it

on:
  workflow_dispatch:
    inputs:
      dominio:
        description: "Dominio da collegare"
        required: true
        default: "www.localcare.it"

permissions:
  contents: read

jobs:
  collega:
    runs-on: ubuntu-latest
    steps:
      - name: Collega il dominio al progetto Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          ACCT="$CF_ACCOUNT_ID"
          if [ -z "$ACCT" ]; then
            ACCT=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or [{}])[0].get('id',''))")
          fi
          echo "Account: $ACCT"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/localcare-site/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${{ github.event.inputs.dominio }}\"}" \
            | python3 -m json.tool
          echo ""
          echo "Se il dominio risulta collegato, crea su register.it il record:"
          echo "  CNAME  www  ->  localcare-site.pages.dev"
